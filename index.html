<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brad-Core OS v5 Unified | Master SDD v5.2 Omega State Hardened</title>
  <meta name="description" content="TRL 7 3U OpenVPX MOSA/SOSA-aligned deterministic hardware safety kernel. Omega State sovereignty, latch.py acoustic root-lock, DoDD 3000.09 eFuse, and immutable testbench telemetry." />
  <style>
    :root {
      --bg-primary: #071320;
      --bg-secondary: #0B0E14;
      --bg-card: #0F1724;
      --bg-card-alt: #080D14;
      --border-color: #1C2B42;
      --border-hi: #294060;
      --accent-cyan: #06B6D4;
      --accent-green: #10B981;
      --accent-amber: #F59E0B;
      --accent-red: #EF4444;
      --accent-purple: #8B5CF6;
      --text-main: #E2E8F0;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --font-mono: 'JetBrains Mono', 'Fira Code', 'Courier New', Courier, monospace;
      --font-sans: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-primary);
      background-image: 
        radial-gradient(circle at 18% 20%, rgba(6, 182, 212, 0.06) 0%, transparent 45%),
        radial-gradient(circle at 82% 65%, rgba(139, 92, 246, 0.06) 0%, transparent 45%),
        linear-gradient(rgba(28, 43, 66, 0.18) 1px, transparent 1px),
        linear-gradient(90deg, rgba(28, 43, 66, 0.18) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 32px 32px, 32px 32px;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 13px;
      line-height: 1.5;
      overflow-x: hidden;
    }

    /* DRAMATIC SLAM-DOWN CRIMSON SHERIFF BANNER */
    .sheriff-slam-banner {
      position: fixed;
      top: -90px;
      left: 0;
      right: 0;
      background: linear-gradient(90deg, #7f1d1d 0%, #ef4444 50%, #7f1d1d 100%);
      color: #ffffff;
      font-family: var(--font-mono);
      font-weight: 900;
      font-size: 0.85rem;
      letter-spacing: 1px;
      padding: 12px 20px;
      text-align: center;
      z-index: 3000;
      box-shadow: 0 10px 40px rgba(239, 68, 68, 0.8);
      border-bottom: 2px solid #ffffff;
      transition: top 0.18s cubic-bezier(0.16, 1, 0.3, 1);
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
    }
    .sheriff-slam-banner.active {
      top: 0;
    }

    /* TOP COMMAND STATUS BAR */
    .status-bar {
      background: #030508;
      border-bottom: 1px solid var(--border-color);
      padding: 6px 16px;
      font-family: var(--font-mono);
      font-size: 0.72rem;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .status-group { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 2px 8px;
      border-radius: 3px;
      font-family: var(--font-mono);
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    .badge-live { background: rgba(16, 185, 129, 0.12); color: var(--accent-green); border: 1px solid rgba(16, 185, 129, 0.45); }
    .badge-pae { background: rgba(6, 182, 212, 0.12); color: var(--accent-cyan); border: 1px solid rgba(6, 182, 212, 0.45); }
    .badge-shield { background: rgba(245, 158, 11, 0.12); color: var(--accent-amber); border: 1px solid rgba(245, 158, 11, 0.45); }
    .badge-red { background: rgba(239, 68, 68, 0.15); color: var(--accent-red); border: 1px solid rgba(239, 68, 68, 0.5); }
    .badge-purple { background: rgba(139, 92, 246, 0.15); color: var(--accent-purple); border: 1px solid rgba(139, 92, 246, 0.5); }

    .pulse-dot {
      width: 7px; height: 7px; background-color: var(--accent-green); border-radius: 50%; display: inline-block;
      box-shadow: 0 0 8px var(--accent-green);
      animation: pulse 1.1s infinite ease-in-out;
    }

    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.3; transform: scale(0.75); } }

    /* TESTBED HEADER BAR */
    header {
      background: rgba(11, 14, 20, 0.92);
      backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--border-color);
      padding: 10px 16px;
    }

    .nav-container {
      max-width: 1560px;
      margin: 0 auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 14px;
    }

    .brand-title { font-family: var(--font-mono); font-size: 1.15rem; font-weight: 800; letter-spacing: 1px; color: #ffffff; }
    .brand-title span { color: var(--accent-cyan); text-shadow: 0 0 10px rgba(6, 182, 212, 0.4); }
    .brand-sub { font-family: var(--font-mono); font-size: 0.68rem; color: var(--text-muted); }

    nav { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
    nav a {
      color: var(--text-main);
      text-decoration: none;
      font-family: var(--font-mono);
      font-size: 0.76rem;
      font-weight: 600;
      padding: 4px 8px;
      border: 1px solid transparent;
      border-radius: 3px;
      transition: all 0.15s;
      cursor: pointer;
    }
    nav a:hover { color: var(--accent-cyan); border-color: var(--border-hi); background: var(--bg-card); }

    .btn-cta {
      background: var(--accent-cyan);
      color: #03070C !important;
      padding: 6px 12px;
      border-radius: 3px;
      font-family: var(--font-mono);
      font-weight: 800;
      font-size: 0.75rem;
      text-decoration: none;
      letter-spacing: 0.4px;
      transition: all 0.2s;
      border: none;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .btn-cta:hover { background: #22D3EE; box-shadow: 0 0 14px rgba(6, 182, 212, 0.6); }

    /* MAIN CONTAINER */
    .container { max-width: 1560px; margin: 0 auto; padding: 14px 16px; }

    /* 2-COLUMN BATTLESPACE LAYOUT (1.66fr : 1fr) */
    .battlespace-container {
      max-width: 1560px;
      margin: 0 auto 18px auto;
      display: grid;
      grid-template-columns: 1.66fr 1fr;
      gap: 12px;
      align-items: stretch;
    }

    @media (max-width: 1200px) {
      .battlespace-container { grid-template-columns: 1fr; }
    }

    .column { display: flex; flex-direction: column; gap: 10px; }

    /* PANEL FRAME */
    .panel {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 5px;
      padding: 12px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      position: relative;
      overflow: hidden;
      transition: all 0.25s ease;
    }

    /* DRAMATIC ALERT STATES */
    .panel.crimson-alert {
      border-color: var(--accent-red) !important;
      background: linear-gradient(180deg, rgba(239, 68, 68, 0.16) 0%, var(--bg-secondary) 100%) !important;
      box-shadow: 0 0 30px rgba(239, 68, 68, 0.5), inset 0 0 20px rgba(239, 68, 68, 0.2) !important;
      animation: chassisShake 0.45s cubic-bezier(.36,.07,.19,.97) both;
    }

    .panel.plume-active {
      border-color: var(--accent-purple) !important;
      background: linear-gradient(180deg, rgba(139, 92, 246, 0.18) 0%, var(--bg-secondary) 100%) !important;
      box-shadow: 0 0 32px rgba(139, 92, 246, 0.55), inset 0 0 24px rgba(139, 92, 246, 0.25) !important;
    }

    @keyframes chassisShake {
      10%, 90% { transform: translate3d(-2px, 0, 0); }
      20%, 80% { transform: translate3d(3px, 0, 0); }
      30%, 50%, 70% { transform: translate3d(-5px, 0, 0); }
      40%, 60% { transform: translate3d(5px, 0, 0); }
    }

    .panel-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 8px;
      flex-wrap: wrap;
      gap: 6px;
    }

    .panel-title {
      font-family: var(--font-mono);
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--accent-cyan);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .panel-sub {
      font-family: var(--font-mono);
      font-size: 0.65rem;
      color: var(--text-muted);
    }

    /* ============================================================================
       TESTBED A: PHYSICAL 3U/6U OPENVPX CHASSIS RACK + AIR-GAP WALL + OSCILLOSCOPE
       ============================================================================ */
    .vpx-chassis-wrapper {
      background: #04070B;
      border: 1px solid var(--border-hi);
      border-radius: 4px;
      padding: 10px;
      position: relative;
      box-shadow: inset 0 0 25px rgba(0, 0, 0, 0.85);
    }

    .chassis-screw-rail {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.58rem;
      color: var(--text-dim);
      padding-bottom: 6px;
      margin-bottom: 8px;
      border-bottom: 1px dashed rgba(41, 64, 96, 0.6);
      letter-spacing: 1px;
    }

    .vpx-rack-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr 64px 1.15fr;
      gap: 8px;
      align-items: stretch;
    }

    @media (max-width: 900px) {
      .vpx-rack-grid { grid-template-columns: 1fr; }
    }

    /* VERTICAL OPENVPX HARDWARE BLADE */
    .vpx-blade {
      background: linear-gradient(180deg, #111A29 0%, #090F18 100%);
      border: 1px solid var(--border-hi);
      border-top: 3px solid var(--accent-green);
      border-radius: 4px;
      padding: 10px 8px;
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 8px;
      position: relative;
      overflow: hidden;
      min-height: 195px;
      transition: all 0.25s ease;
    }

    .vpx-blade.slot-sheriff { border-top-color: var(--accent-amber); }
    .vpx-blade.slot-mcore { border-top-color: var(--accent-cyan); }
    .vpx-blade.slot-pcore { 
      border-top-color: var(--accent-cyan); 
      background: linear-gradient(180deg, rgba(6, 182, 212, 0.1) 0%, #090F18 100%);
    }

    /* ANIMATED LASER SCANLINE INSIDE EACH BLADE */
    .vpx-blade::after {
      content: '';
      position: absolute;
      top: -20%;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, var(--accent-green), transparent);
      opacity: 0.65;
      animation: bladeLaser 2.4s infinite linear;
      pointer-events: none;
    }
    .vpx-blade.slot-sheriff::after {
      background: linear-gradient(90deg, transparent, var(--accent-amber), transparent);
      animation-duration: 1.9s;
    }
    .vpx-blade.slot-mcore::after {
      background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
      animation-duration: 2.8s;
    }
    .vpx-blade.slot-pcore::after {
      background: linear-gradient(90deg, transparent, var(--accent-cyan), var(--accent-purple), transparent);
      animation-duration: 1.4s;
    }

    @keyframes bladeLaser {
      0% { top: 0%; opacity: 0.1; }
      50% { opacity: 0.85; }
      100% { top: 100%; opacity: 0.1; }
    }

    .blade-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(41, 64, 96, 0.5);
      padding-bottom: 4px;
    }

    .blade-slot-id {
      font-size: 0.65rem;
      font-weight: 800;
      color: #ffffff;
      background: rgba(255,255,255,0.07);
      padding: 1px 5px;
      border-radius: 2px;
    }

    .blade-leds { display: flex; gap: 4px; align-items: center; }
    .led {
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--accent-green);
      box-shadow: 0 0 6px var(--accent-green);
      animation: ledBlink 1.1s infinite alternate;
    }
    .led.amber { background: var(--accent-amber); box-shadow: 0 0 6px var(--accent-amber); animation-delay: 0.3s; }
    .led.cyan { background: var(--accent-cyan); box-shadow: 0 0 6px var(--accent-cyan); animation-delay: 0.6s; }
    .led.red { background: var(--accent-red); box-shadow: 0 0 8px var(--accent-red); animation-duration: 0.25s; }

    @keyframes ledBlink { 0% { opacity: 0.35; } 100% { opacity: 1; } }

    .blade-title {
      font-size: 0.74rem;
      font-weight: 800;
      color: var(--accent-cyan);
      line-height: 1.25;
    }
    .vpx-blade.slot-dcore .blade-title { color: var(--accent-green); }
    .vpx-blade.slot-sheriff .blade-title { color: var(--accent-amber); }

    .blade-specs {
      font-size: 0.62rem;
      color: var(--text-muted);
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .blade-specs div {
      display: flex;
      justify-content: space-between;
      border-bottom: 1px dotted rgba(100, 116, 139, 0.25);
      padding-bottom: 1px;
    }
    .blade-specs strong { color: var(--text-main); }

    .blade-telemetry-footer {
      background: #05080D;
      border: 1px solid var(--border-color);
      border-radius: 3px;
      padding: 4px 6px;
      font-size: 0.6rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      color: var(--accent-green);
    }

    /* VERTICAL 0-BYTE SHARED HOST RAM AIR-GAP WALL */
    .air-gap-vertical {
      background: repeating-linear-gradient(
        -45deg,
        rgba(245, 158, 11, 0.14),
        rgba(245, 158, 11, 0.14) 8px,
        rgba(4, 7, 11, 0.95) 8px,
        rgba(4, 7, 11, 0.95) 16px
      );
      border: 1px dashed var(--accent-amber);
      border-radius: 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding: 8px 4px;
      text-align: center;
      font-family: var(--font-mono);
      position: relative;
      box-shadow: 0 0 15px rgba(245, 158, 11, 0.15);
    }

    .air-gap-lock-icon {
      font-size: 1.1rem;
      background: #04070B;
      border: 1px solid var(--accent-amber);
      border-radius: 50%;
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 10px rgba(245, 158, 11, 0.45);
      animation: lockPulse 2s infinite ease-in-out;
    }

    @keyframes lockPulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 8px rgba(245, 158, 11, 0.4); }
      50% { transform: scale(1.08); box-shadow: 0 0 16px rgba(245, 158, 11, 0.85); }
    }

    .air-gap-vertical-text {
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
      font-size: 0.62rem;
      font-weight: 800;
      color: var(--accent-amber);
      letter-spacing: 1px;
      text-transform: uppercase;
    }

    .spsc-arrow-badge {
      font-size: 0.55rem;
      color: var(--accent-cyan);
      background: #04070B;
      border: 1px solid var(--accent-cyan);
      padding: 2px 3px;
      border-radius: 2px;
      font-weight: 700;
    }

    /* LIVE 1,600 HZ OSCILLOSCOPE + SPSC TELEMETRY STRIP */
    .scope-strip {
      margin-top: 8px;
      background: #03060A;
      border: 1px solid var(--border-hi);
      border-radius: 4px;
      padding: 8px 10px;
      display: grid;
      grid-template-columns: 1.35fr 1fr;
      gap: 10px;
      align-items: center;
    }
    @media (max-width: 780px) { .scope-strip { grid-template-columns: 1fr; } }

    .scope-canvas-wrap {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .scope-header {
      display: flex;
      justify-content: space-between;
      font-family: var(--font-mono);
      font-size: 0.64rem;
      color: var(--text-muted);
    }

    #oscilloscope {
      width: 100%;
      height: 54px;
      background: #020407;
      border: 1px solid rgba(16, 185, 129, 0.35);
      border-radius: 3px;
      display: block;
    }

    .scope-metrics-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
      font-family: var(--font-mono);
    }

    .scope-stat {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-left: 2px solid var(--accent-green);
      padding: 5px 8px;
      border-radius: 3px;
    }
    .scope-stat-key { font-size: 0.58rem; color: var(--text-muted); display: block; }
    .scope-stat-val { font-size: 0.72rem; font-weight: 800; color: var(--accent-green); }

    /* ============================================================================
       ANIMATED OPTINC >10 kV PHOTONIC LVDS BRIDGE
       ============================================================================ */
    .optinc-bridge-animated {
      background: #050B14;
      border: 1px solid rgba(6, 182, 212, 0.5);
      border-radius: 4px;
      padding: 7px 14px;
      font-family: var(--font-mono);
      font-size: 0.69rem;
      font-weight: 800;
      color: var(--accent-cyan);
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: relative;
      overflow: hidden;
      box-shadow: 0 0 18px rgba(6, 182, 212, 0.15);
    }

    .optinc-beam {
      position: absolute;
      top: 0;
      bottom: 0;
      width: 35%;
      background: linear-gradient(90deg, transparent, rgba(6, 182, 212, 0.25), rgba(139, 92, 246, 0.25), transparent);
      animation: photonicStream 1.8s infinite linear;
      pointer-events: none;
    }

    @keyframes photonicStream {
      0% { left: -35%; }
      100% { left: 100%; }
    }

    .optinc-bridge-animated.severed {
      border-color: var(--accent-red);
      color: var(--accent-red);
      background: rgba(239, 68, 68, 0.1);
    }

    /* ============================================================================
       TESTBED B: AMY INFINITY (v∞) DEDICATED OOB FARADAY SUBSTRATE
       ============================================================================ */
    .faraday-cage-panel {
      border: 1px solid rgba(139, 92, 246, 0.55);
      background: linear-gradient(180deg, rgba(139, 92, 246, 0.07) 0%, #090C12 100%);
      box-shadow: inset 0 0 20px rgba(139, 92, 246, 0.1);
    }

    .amy-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }
    @media (max-width: 780px) { .amy-grid { grid-template-columns: 1fr; } }

    .amy-blade-card {
      background: rgba(15, 23, 36, 0.9);
      border: 1px solid rgba(139, 92, 246, 0.4);
      border-left: 3px solid var(--accent-purple);
      border-radius: 4px;
      padding: 9px 11px;
      font-family: var(--font-mono);
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: relative;
      overflow: hidden;
    }

    .amy-blade-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      font-weight: 800;
      color: #DDD6FE;
    }

    .amy-blade-sub {
      font-size: 0.64rem;
      color: var(--text-muted);
      display: flex;
      justify-content: space-between;
    }

    /* SUPERCAPACITOR RAIL PROGRESS BAR */
    .supercap-bar-wrap {
      width
